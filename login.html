<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication & Workspace Login | Finance & GST Tools</title>
  <meta name="description" content="Secure authentication for Finance & GST Tools. Create an account or log in with your registered credentials.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
</head>
<body class="auth-page">
  <!-- Background Glows -->
  <div class="bg-glow glow-1" aria-hidden="true"></div>
  <div class="bg-glow glow-2" aria-hidden="true"></div>

  <div class="auth-wrapper">
    <!-- Back to App Link -->
    <a href="index.html" class="auth-back-link">
      <span>&larr;</span> Return to Finance & GST Tools
    </a>

    <div class="card auth-card">
      <div class="auth-header">
        <div class="auth-brand-icon">💼</div>
        <h1 id="authTitle">Welcome to Finance & GST Tools</h1>
        <p class="auth-subtitle" id="authSubtitle">Create an account or sign in to authenticate</p>

        <!-- Status / Error Alert Banner -->
        <div id="authAlert" class="auth-alert" role="alert">
          <span id="alertIcon">ℹ️</span>
          <div id="alertMessage">Please create an account before logging in.</div>
        </div>
      </div>

      <!-- Mode Switcher Tabs (Sign In / Create Account) -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab" id="tabSignIn" role="tab" aria-selected="false">Sign In</button>
        <button type="button" class="auth-tab active" id="tabSignUp" role="tab" aria-selected="true">Create Account</button>
      </div>

      <!-- Main Form -->
      <form id="authForm" class="auth-form" novalidate>
        <!-- Full Name Field (Create Account mode) -->
        <div class="form-group" id="nameGroup">
          <label for="nameInput">Full Name *</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input type="text" id="nameInput" class="form-input" placeholder="e.g. Shashi" autocomplete="name">
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="form-group">
          <label for="emailInput">Email Address *</label>
          <div class="input-with-icon">
            <span class="input-icon">✉️</span>
            <input type="email" id="emailInput" class="form-input" placeholder="shashi@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="label-row">
            <label for="passwordInput">Password *</label>
            <a href="#" id="forgotPasswordLink" class="btn-link sm-link" style="display: none;">Forgot password?</a>
          </div>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="passwordInput" class="form-input" placeholder="At least 6 characters" required autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <!-- Confirm Password Field (Create Account mode only) -->
        <div class="form-group" id="confirmPasswordGroup">
          <label for="confirmPasswordInput">Confirm Password *</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Repeat your password" autocomplete="new-password">
            <button type="button" id="toggleConfirmPasswordBtn" class="toggle-password-btn" aria-label="Toggle confirm password visibility">👁️</button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-row-remember" id="rememberRow" style="display: none;">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Keep me logged in on this browser</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-large full-width" id="submitAuthBtn">
          <span id="submitBtnText">Create Account</span>
        </button>
      </form>

      <!-- Registered Accounts Quick Preview Box -->
      <div id="registeredAccountsBox" style="margin-top: 1.25rem; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
        <span id="registeredCountText">0 registered accounts found.</span>
      </div>

      <!-- Footer Mode Switcher -->
      <div class="auth-footer-help">
        <span id="toggleModeText">Already registered?</span>
        <button type="button" class="btn-link" id="switchModeBtn">Sign in with your account</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script>
    // Theme setup from parent app
    const savedTheme = localStorage.getItem('focusflow_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // DOM Elements
    const tabSignIn = document.getElementById('tabSignIn');
    const tabSignUp = document.getElementById('tabSignUp');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const authAlert = document.getElementById('authAlert');
    const alertIcon = document.getElementById('alertIcon');
    const alertMessage = document.getElementById('alertMessage');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const rememberRow = document.getElementById('rememberRow');
    const submitBtnText = document.getElementById('submitBtnText');
    const authForm = document.getElementById('authForm');
    const switchModeBtn = document.getElementById('switchModeBtn');
    const toggleModeText = document.getElementById('toggleModeText');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPasswordBtn');
    const toastContainer = document.getElementById('toastContainer');
    const registeredCountText = document.getElementById('registeredCountText');

    let mode = 'signup'; // default to 'signup' so users create account first!

    // ==========================================
    // USER REGISTRY IN LOCALSTORAGE
    // ==========================================
    const USERS_STORAGE_KEY = 'focusflow_registered_users';

    function getRegisteredUsers() {
      try {
        const data = localStorage.getItem(USERS_STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRegisteredUsers(users) {
      localStorage.setItem(USERS_STORAGE_KEY, JSON.stringify(users));
      updateRegisteredAccountsCounter();
    }

    function updateRegisteredAccountsCounter() {
      const users = getRegisteredUsers();
      if (users.length === 0) {
        registeredCountText.innerHTML = '🔒 <em>Authentication is enforced: You must create an account first before logging in.</em>';
      } else {
        const names = users.map(u => u.name).join(', ');
        registeredCountText.innerHTML = `🛡️ Registered user${users.length > 1 ? 's' : ''} on this device: <strong>${escapeHtml(names)}</strong>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Alert Banner Helper
    function showAlert(type, icon, messageHtml) {
      authAlert.className = `auth-alert ${type}`;
      alertIcon.textContent = icon;
      alertMessage.innerHTML = messageHtml;
      authAlert.style.display = 'flex';

      // Attach any action button in alert
      const switchBtn = alertMessage.querySelector('.alert-link-btn');
      if (switchBtn) {
        switchBtn.addEventListener('click', () => {
          setMode(switchBtn.getAttribute('data-target-mode') || 'signup');
        });
      }
    }

    function hideAlert() {
      authAlert.style.display = 'none';
    }

    function showToast(message, icon = '✨') {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // Set Mode: 'signup' or 'signin'
    function setMode(newMode, preserveAlert = false) {
      mode = newMode;
      if (!preserveAlert) hideAlert();

      if (mode === 'signup') {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        authTitle.textContent = 'Create an Account';
        authSubtitle.textContent = 'Register your credentials before signing in';
        nameGroup.style.display = 'flex';
        confirmPasswordGroup.style.display = 'flex';
        rememberRow.style.display = 'none';
        forgotPasswordLink.style.display = 'none';
        submitBtnText.textContent = 'Create Account';
        toggleModeText.textContent = 'Already have an account?';
        switchModeBtn.textContent = 'Sign in with your account';
        nameInput.focus();
      } else {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        authTitle.textContent = 'Sign In';
        authSubtitle.textContent = 'Authenticate with your registered account';
        nameGroup.style.display = 'none';
        confirmPasswordGroup.style.display = 'none';
        rememberRow.style.display = 'flex';
        forgotPasswordLink.style.display = 'inline';
        submitBtnText.textContent = 'Authenticate & Sign In';
        toggleModeText.textContent = "Don't have an account yet?";
        switchModeBtn.textContent = 'Create an account first';
        emailInput.focus();
      }
    }

    tabSignIn.addEventListener('click', () => {
      // Check if any accounts exist
      const users = getRegisteredUsers();
      if (users.length === 0) {
        showAlert('info', 'ℹ️', 'No accounts found on this device! Please <button type="button" class="alert-link-btn" data-target-mode="signup">Create an Account</button> first.');
      }
      setMode('signin', true);
    });

    tabSignUp.addEventListener('click', () => setMode('signup'));
    switchModeBtn.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));

    // Toggle Passwords
    togglePasswordBtn.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      togglePasswordBtn.textContent = isPass ? '🙈' : '👁️';
    });

    toggleConfirmPasswordBtn.addEventListener('click', () => {
      const isPass = confirmPasswordInput.type === 'password';
      confirmPasswordInput.type = isPass ? 'text' : 'password';
      toggleConfirmPasswordBtn.textContent = isPass ? '🙈' : '👁️';
    });

    // Forgot password handler
    forgotPasswordLink.addEventListener('click', (e) => {
      e.preventDefault();
      const email = emailInput.value.trim() || prompt('Enter your registered email:');
      if (!email) return;
      const users = getRegisteredUsers();
      const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (user) {
        showAlert('info', '🔑', `Your registered password is: <strong>${escapeHtml(user.password)}</strong> (For testing/demo purposes)`);
      } else {
        showAlert('error', '❌', `No account found for "${escapeHtml(email)}". Please <button type="button" class="alert-link-btn" data-target-mode="signup">Create an Account</button>.`);
      }
    });

    // Form Submission & Authentication
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideAlert();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const users = getRegisteredUsers();

      // ====================================
      // 1. CREATE ACCOUNT MODE
      // ====================================
      if (mode === 'signup') {
        const name = nameInput.value.trim();
        const confirmPassword = confirmPasswordInput.value;

        // Validation: Name
        if (!name || name.length < 2) {
          showAlert('error', '⚠️', 'Please enter your Full Name (at least 2 characters).');
          nameInput.focus();
          return;
        }

        // Validation: Email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
          showAlert('error', '⚠️', 'Please enter a valid email address (e.g. name@example.com).');
          emailInput.focus();
          return;
        }

        // Validation: Password length
        if (!password || password.length < 6) {
          showAlert('error', '⚠️', 'Password must be at least 6 characters long.');
          passwordInput.focus();
          return;
        }

        // Validation: Password match
        if (password !== confirmPassword) {
          showAlert('error', '⚠️', 'Passwords do not match! Please check and confirm your password.');
          confirmPasswordInput.focus();
          return;
        }

        // Check for duplicate email
        const existing = users.find(u => u.email.toLowerCase() === email);
        if (existing) {
          showAlert('error', '⚠️', `An account with this email already exists! <button type="button" class="alert-link-btn" data-target-mode="signin">Click here to Sign In</button>.`);
          return;
        }

        // Registration success!
        const newUser = {
          id: Date.now(),
          name: name,
          email: email,
          password: password,
          createdAt: new Date().toISOString()
        };

        users.push(newUser);
        saveRegisteredUsers(users);

        showToast(`🎉 Account created for ${name}!`, '✅');
        showAlert('success', '🎉', `Account created successfully! You can now <button type="button" class="alert-link-btn" data-target-mode="signin">Sign In</button> with your credentials.`);

        // Switch to Sign In mode with prefilled values
        setTimeout(() => {
          setMode('signin', true);
          emailInput.value = email;
          passwordInput.value = '';
          passwordInput.focus();
        }, 1200);

        return;
      }

      // ====================================
      // 2. SIGN IN (AUTHENTICATION) MODE
      // ====================================
      if (mode === 'signin') {
        if (!email) {
          showAlert('error', '⚠️', 'Please enter your email address.');
          emailInput.focus();
          return;
        }

        if (!password) {
          showAlert('error', '⚠️', 'Please enter your password.');
          passwordInput.focus();
          return;
        }

        // 1. CHECK IF ACCOUNT EXISTS
        const user = users.find(u => u.email.toLowerCase() === email);

        if (!user) {
          // ACCOUNT NOT FOUND: MUST CREATE ACCOUNT FIRST!
          showAlert('error', '❌', `<strong>Account not found!</strong> No registered account matches <em>${escapeHtml(email)}</em>. You must <button type="button" class="alert-link-btn" data-target-mode="signup">Create an Account</button> first before logging in.`);
          showToast('Account not found. Please create account first!', '❌');
          return;
        }

        // 2. CHECK PASSWORD AUTHENTICATION
        if (user.password !== password) {
          showAlert('error', '❌', '<strong>Authentication failed!</strong> Incorrect password. Please check your password and try again.');
          showToast('Incorrect password', '❌');
          passwordInput.focus();
          return;
        }

        // 3. AUTHENTICATION SUCCESSFUL!
        showAlert('success', '✅', `<strong>Authentication successful!</strong> Welcome back, ${escapeHtml(user.name)}. Redirecting to your workspace...`);
        submitBtnText.textContent = '✓ Authenticated! Redirecting...';

        // Store active session
        localStorage.setItem('focusflow_user', JSON.stringify({
          id: user.id,
          name: user.name,
          email: user.email,
          avatar: '⚡',
          loggedInAt: new Date().toISOString()
        }));

        showToast(`Welcome back, ${user.name}!`, '🚀');

        setTimeout(() => {
          window.location.href = 'index.html?login=success';
        }, 900);
      }
    });

    // Initialization check
    updateRegisteredAccountsCounter();

    // Check if user already has registered accounts
    const initialUsers = getRegisteredUsers();
    if (initialUsers.length === 0) {
      // Force Create Account mode first
      setMode('signup', true);
      showAlert('info', 'ℹ️', '<strong>Welcome!</strong> Before logging in, you must create an account first. Fill out the form below to get started.');
    } else {
      // If accounts already exist on this device, default to Sign In
      setMode('signin', true);
    }
  </script>
</body>
</html>
